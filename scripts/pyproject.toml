[project]
name = "lattice-local-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apache-ossie>=0.2.0.dev0",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "sqlglot>=30.12.0",
    "pytest>=8.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "duckdb>=1.2,<2",
    "pyarrow>=17",
    "PyMySQL>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "clickhouse-connect>=0.8,<1",
    "PyHive[hive_pure_sasl]>=0.7,<1",
    "thrift>=0.16,<1",
    "pyiceberg[pyarrow]>=0.9,<1",
    "pypaimon>=1.0,<3",
    "anthropic>=1.0,<2",
    "croniter>=3.0,<7",
    "oracledb>=2.5,<4",
    "pymssql>=2.3,<3",
    "pymongo>=4.10,<5",
    "kafka-python>=2.0.2,<3",
]

[tool.uv]
required-version = ">=0.9.0"
package = false

[tool.uv.sources]
apache-ossie = { path = "../python", editable = true }
